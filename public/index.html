<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Aplikasi Kuitansi Digital">
  <meta name="theme-color" content="#0f766e">
  <title>Kuitansi Digital</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="toast" class="toast"></div>
  <header class="topbar">
    <div class="brand">
      <div class="brand-logo">✓</div>
      <div>
        <b id="brandName">Kuitansi Digital</b>
        <small>Aplikasi pencetak kuitansi</small>
      </div>
    </div>
    <button class="btn primary" id="newBtn">＋ Kuitansi Baru</button>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="form">Buat Kuitansi</button>
    <button class="tab" data-tab="history">Riwayat</button>
    <button class="tab" data-tab="settings">Pengaturan</button>
  </nav>

  <main>
    <section id="formTab" class="workspace">
      <div class="card no-print">
        <div class="card-head">
          <div><h2>Data Kuitansi</h2><p>Isi transaksi kemudian simpan ke Google Spreadsheet.</p></div>
          <span class="status">SIAP</span>
        </div>

        <div class="grid">
          <label>Nomor Kuitansi<input id="number" placeholder="Otomatis"></label>
          <label>Tanggal<input id="date" type="date"></label>
          <label class="wide">Diterima dari<input id="payer" placeholder="Nama orang / instansi"></label>
          <label class="wide">Alamat / keterangan penerima<input id="address" placeholder="Opsional"></label>
          <label>Metode<select id="method"><option>Tunai</option><option>Transfer</option><option>QRIS</option><option>Debit</option><option>Kredit</option></select></label>
          <label>Diskon<input id="discount" type="number" min="0" value="0"></label>
        </div>

        <div class="section-head">
          <h3>Rincian Pembayaran</h3>
          <button class="btn small" id="addItem">＋ Tambah Item</button>
        </div>
        <div id="items"></div>

        <label class="notes">Catatan<textarea id="notes" rows="3" placeholder="Catatan tambahan"></textarea></label>

        <div class="actions">
          <button class="btn primary" id="saveBtn">Simpan Kuitansi</button>
          <button class="btn" id="printBtn">🖨 Cetak / PDF</button>
          <button class="btn" id="resetBtn">Reset</button>
        </div>
      </div>

      <div class="preview-area">
        <div id="receipt" class="receipt"></div>
      </div>
    </section>

    <section id="historyTab" class="card page hidden no-print">
      <div class="card-head">
        <div><h2>Riwayat Kuitansi</h2><p>Data diambil dari Google Spreadsheet.</p></div>
        <input id="search" class="search" placeholder="Cari nomor / nama / item">
      </div>
      <div id="history"></div>
    </section>

    <section id="settingsTab" class="card page hidden no-print">
      <div class="card-head"><div><h2>Pengaturan</h2><p>Identitas yang tampil di kuitansi.</p></div></div>
      <div class="settings">
        <label>Nama usaha / sekolah<input id="sName"></label>
        <label>Alamat<input id="sAddress"></label>
        <label>Telepon / WhatsApp<input id="sPhone"></label>
        <label>Nama penandatangan<input id="sSigner"></label>
        <label>Footer<input id="sFooter"></label>
        <label>Logo (URL gambar)<input id="sLogo" placeholder="https://..."></label>
        <button class="btn primary" id="saveSettings">Simpan Pengaturan</button>
      </div>
    </section>
  </main>

  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
